name: Update solution table

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  update-table:
    runs-on: ubuntu-latest
    steps:
      - name: Add or update PR result in issue
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body ?? "";

            const getField = (label) => {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = body.match(
                new RegExp(`^-\\s*${escaped}\\s*:\\s*(.+?)\\s*$`, "mi"),
              );
              return match?.[1]?.trim();
            };

            const issueMatch = body.match(
              /^-\s*Issue Number\s*:\s*#(\d+)\s*$/mi,
            );
            const executionTime = getField("실행시간");
            const timeComplexity = getField("시간 복잡도");
            const memory = getField("메모리");

            const missing = [];
            if (!issueMatch) missing.push("Issue Number");
            if (!executionTime) missing.push("실행시간");
            if (!timeComplexity) missing.push("시간 복잡도");
            if (!memory) missing.push("메모리");

            if (missing.length > 0) {
              core.setFailed(
                `PR 본문에 다음 항목을 작성해주세요: ${missing.join(", ")}`,
              );
              return;
            }

            const issueNumber = Number(issueMatch[1]);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (issueNumber === pr.number) {
              core.setFailed("Issue Number에는 PR 번호가 아닌 문제 이슈 번호를 작성해주세요.");
              return;
            }

            let issue;
            try {
              const response = await github.rest.issues.get({
                owner,
                repo,
                issue_number: issueNumber,
              });
              issue = response.data;
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`이슈 #${issueNumber}을 찾을 수 없습니다.`);
                return;
              }
              throw error;
            }

            if (issue.pull_request) {
              core.setFailed(`#${issueNumber}은 이슈가 아니라 PR입니다.`);
              return;
            }

            const escapeCell = (value) =>
              String(value)
                .replace(/\r?\n/g, " ")
                .replace(/\|/g, "\\|")
                .trim();

            const startMarker = "<!-- solution-table:start -->";
            const endMarker = "<!-- solution-table:end -->";
            const rowMarker = `<!-- solution-pr:${pr.number} -->`;
            const tableHeader = [
              "| 제출자 | 실행시간 | 시간 복잡도 | 메모리 사용량 | PR |",
              "| --- | --- | --- | --- | --- |",
            ];
            const row = [
              `| [@${pr.user.login}](${pr.user.html_url})`,
              escapeCell(executionTime),
              escapeCell(timeComplexity),
              escapeCell(memory),
              `[#${pr.number}](${pr.html_url}) ${rowMarker} |`,
            ].join(" | ");

            let issueBody = issue.body ?? "";
            const startIndex = issueBody.indexOf(startMarker);
            const endIndex = issueBody.indexOf(endMarker);

            if (
              startIndex === -1 ||
              endIndex === -1 ||
              endIndex < startIndex
            ) {
              const separator = issueBody.trim() ? "\n\n" : "";
              issueBody = [
                issueBody.trimEnd(),
                separator,
                "### 제출 현황",
                "",
                startMarker,
                ...tableHeader,
                row,
                endMarker,
              ].join("\n");
            } else {
              const contentStart = startIndex + startMarker.length;
              const tableContent = issueBody.slice(contentStart, endIndex);
              let lines = tableContent
                .split(/\r?\n/)
                .map((line) => line.trimEnd())
                .filter((line) => line.trim());

              if (lines.length < 2) {
                lines = [...tableHeader];
              } else {
                lines[0] = tableHeader[0];
                lines[1] = tableHeader[1];
              }

              const existingRow = lines.findIndex((line) =>
                line.includes(rowMarker),
              );

              if (existingRow === -1) {
                lines.push(row);
              } else {
                lines[existingRow] = row;
              }

              issueBody =
                issueBody.slice(0, contentStart) +
                `\n${lines.join("\n")}\n` +
                issueBody.slice(endIndex);
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body: issueBody,
            });

            core.info(
              `이슈 #${issueNumber}의 제출 현황을 PR #${pr.number} 정보로 갱신했습니다.`,
            );
